<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>Mosaic</title>
  <meta name="application-name" content="Mosaic" />
  <meta name="apple-mobile-web-app-title" content="Mosaic" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
</head>
<body>
  <main id="app">
    <h1>Mosaic</h1>
  </main>

  <div class="app-banner" id="install-banner" data-testid="install-banner" hidden>
    <img src="./icons/icon-192.png" alt="" width="40" height="40" />
    <div class="app-banner-text">
      <strong>Zainstaluj Mosaic</strong>
      <span class="only-prompt">Aplikacja na ekranie głównym, działa też bez internetu.</span>
      <span class="only-ios">Stuknij <b>Udostępnij</b> <svg class="icon inline" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>, potem <b>Do ekranu początkowego</b>.</span>
    </div>
    <button class="btn btn-primary only-prompt" id="btn-install" data-testid="install">Zainstaluj</button>
    <button class="icon-btn" id="btn-install-close" data-testid="install-close" aria-label="Nie pokazuj więcej">✕</button>
  </div>
  <div class="app-banner" id="update-banner" data-testid="update-banner" role="alert" hidden>
    <div class="app-banner-text">
      <strong>Dostępna nowa wersja Mosaic</strong>
      <span>Twoja praca zostanie zachowana.</span>
    </div>
    <button class="btn btn-primary" id="btn-update" data-testid="update">Odśwież</button>
    <button class="btn btn-dark" id="btn-update-later">Później</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
